# ===========================================
# LEARN_X_CODE - Application Configuration
# ===========================================

# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/learn_x_code?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=YourSecretKeyForJWTTokenGenerationMakeItLongAndSecure123456789
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

# Logging
logging.level.org.springframework=INFO
logging.level.com.learnxcode=DEBUG
